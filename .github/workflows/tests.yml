name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-core p7zip-full
      - name: Python packages
        run: python -m pip install --upgrade pip && python -m pip install pygame-ce pytest
      - name: Syntax
        run: python -m py_compile main.py hub/*.py hub/themes/*.py tools/*.py
      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider
