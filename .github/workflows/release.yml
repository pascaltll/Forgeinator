name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check VERSION matches the tag
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build installer, update zip, QAM app zip and SHA256SUMS
        run: python tools/make_release.py --out dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/forgeinator-*.zip
            dist/SHA256SUMS
            dist/install-hub-v*.sh
            dist/recomp-hub-update-v*.zip
          generate_release_notes: true
