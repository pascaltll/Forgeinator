# Receta de EJECUCIÓN: la release de Linux de God of War Native PC está compilada en Ubuntu 26.04 (glibc 2.43, Qt 6.10 del sistema)
# y no arranca en Bazzite. Hub crea un distrobox con esa distribución e instala lo que pide el proyecto (docs/linux.md).
# Probado a mano en Bazzite 45 el 11-11-2026 (el lanzador abrió en la sesión de juego).
[match]
repos = ["Vnnc1/gow-native-pc"]
ids = ["gow-native-pc"]

[runtime]
image = "ubuntu:26.04"
name = "hub-{id}"
pm = "apt"
packages = [
  # para abrir el lanzador (Qt Quick + SDL2)
  "libqt6quickcontrols2-6", "libqt6quick6", "libqt6qml6", "libqt6opengl6", "libqt6network6", "libqt6gui6", "libsdl2-2.0-0",
  "qml6-module-qtquick", "qml6-module-qtquick-controls", "qml6-module-qtquick-layouts", "qml6-module-qtquick-window",
  "qml6-module-qtquick-templates", "qml6-module-qtquick-effects", "qml6-module-qtcore", "qml6-module-qtqml",
  "qml6-module-qtqml-workerscript", "qml6-module-qtqml-models", "qml6-module-qt-labs-settings",
  "libegl-mesa0", "libglx-mesa0", "mesa-vulkan-drivers", "libxcb-cursor0",
  # para importar TU disco: el lanzador compila el juego (docs/linux.md, «Build from source»)
  "git", "python3", "clang", "cmake", "ninja-build", "pkg-config", "libsdl2-dev", "libgl1-mesa-dev", "libx11-dev",
  "libxrandr-dev", "libxinerama-dev", "libxcursor-dev", "libxi-dev", "libasound2-dev", "qt6-base-dev", "qt6-declarative-dev",
]
check = ["ldd launcher/bin/gow-launcher 2>/dev/null | grep 'not found' || echo 'bibliotecas del lanzador: completas'"]
